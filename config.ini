; ==============================================================================
; Breezi Launcher Configuration x Tấn Cutos
; Cấu hình duy nhất cho cả Launcher và Breezi Injector
; ==============================================================================

; Đường dẫn tệp thực thi game (Ví dụ: C:\Program Files\Genshin Impact\GenshinImpact.exe hoặc StarRail.exe)
GamePath=

; Địa chỉ máy chủ xác thực và cập nhật
ServerUrl=http://127.0.0.1:5000

; Tự động thu nhỏ launcher khi bấm Play (true / false)
AutoMinimize=true

; Đường dẫn trực tiếp (Direct URL) ảnh nền launcher (.jpg / .png)
